services:

  postgres:
    image: postgres:16
    container_name: ai-workflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  hasura:
    image: hasura/graphql-engine:v2.49.5-ce.cli-migrations-v3
    container_name: ai-workflow-hasura
    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "8500:8080"

    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgres@postgres:5432/workflow_db

      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"

      HASURA_GRAPHQL_DEV_MODE: "true"

      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log,query-log

      HASURA_GRAPHQL_ADMIN_SECRET: dev-admin-secret

volumes:
  postgres_data: